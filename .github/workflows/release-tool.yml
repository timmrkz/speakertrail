# Builds speakertrail-release from the checkout, for Linux and for the
# Mac, signs both with a build attestation and, on main, keeps them as the
# assets of the release release-tool that .github/actions/release-tool
# downloads, so the jobs that hold a key run main's own build of main's
# own code, built from no cache, without each building it again. Ported
# from FrameFairy, see
# docs/decisions/2026-11-24-the-release-tool-built-once.md.
#
# It runs on every push to main. Its job fits asks main's signed tool
# whether it is built from this commit's code, since only the tool knows
# what it is built from, see
# docs/decisions/2026-11-25-the-release-tool-keys-itself.md, and the job
# build makes a new one when it is not. FrameFairy calls it from
# builds.yml. Here it is a workflow of its own, so a tool that fails to
# build never fails the run of builds.yml that publish.yml waits for, and
# main's build still reaches Updates. The job build holds main's signing
# identity and runs nothing it downloaded. Started by hand on a branch, it
# builds and signs and keeps the tool as an artifact of the run, and
# uploads nothing: only main's build is the release's.
name: Release tool

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Not cancelled by a newer push: a build of older code does not fit newer
# code, and the next push to main builds again.
concurrency:
  group: release-tool-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Whether main's signed release tool still fits this commit's code,
  # asked of the tool itself, by a job that holds no token that writes.
  fits:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    outputs:
      built: ${{ steps.tool.outputs.built }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tool
        uses: ./.github/actions/release-tool

  build:
    needs: fits
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.fits.outputs.built == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Built here, from no cache, and the Linux build put on the path.
      - uses: ./.github/actions/release-tool
        with:
          download: "false"
      # The Mac's, named the way runner.os and runner.arch name a Mac
      # runner, built with the cache the build before filled.
      - name: Build the release tool for the Mac
        env:
          CGO_ENABLED: "0"
        run: go run -trimpath ./cmd/speakertrail-release self -goos darwin -goarch arm64 -out "$RUNNER_TEMP/release-tool/built/speakertrail-release-macOS-ARM64"
      - name: Name the Linux build
        run: cp "$RUNNER_TEMP/release-tool/built/speakertrail-release" "$RUNNER_TEMP/release-tool/built/speakertrail-release-Linux-X64"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-tool/built/speakertrail-release-*
      - if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: speakertrail-release
          path: ${{ runner.temp }}/release-tool/built/speakertrail-release-*
          retention-days: 3
      # The release holds one build for each system. What makes a job
      # trust one is main's signature and its key, never that it is
      # there: a job of an older commit finds a build of newer code, which
      # does not fit, and builds.
      - if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: speakertrail-release keep "$RUNNER_TEMP"/release-tool/built/speakertrail-release-*
