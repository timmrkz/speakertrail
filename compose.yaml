# Speaker Trail on one machine: Postgres, the web interface and the nightly
# crawl. Used for local development and as plan B on a plain server.
#
#   docker compose up -d postgres web      start the database and the interface
#   docker compose run --rm nightly        run one crawl now
#
# Put UI_PASSWORD_HASH and SESSION_SECRET in a .env file next to this one.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: speakertrail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-speakertrail}
      POSTGRES_DB: speakertrail
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "speakertrail"]
      interval: 5s
      retries: 10

  web:
    build: .
    command: ["serve"]
    environment:
      DATABASE_URL: postgres://speakertrail:${POSTGRES_PASSWORD:-speakertrail}@postgres:5432/speakertrail?sslmode=disable
      UI_PASSWORD_HASH: ${UI_PASSWORD_HASH:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  nightly:
    build: .
    command: ["nightly"]
    environment:
      DATABASE_URL: postgres://speakertrail:${POSTGRES_PASSWORD:-speakertrail}@postgres:5432/speakertrail?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["crawl"]

volumes:
  postgres:
