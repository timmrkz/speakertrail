# Signs and publishes the builds builds.yml makes, and keeps the channel
# list the app updates itself from. See docs/UPDATES.md. Ported from
# FrameFairy, which works the same way.
#
# builds.yml runs a branch's own code, so it holds no secret and no token
# that can write: a push runs the workflow file of the branch pushed, and
# whatever that file is given, any branch can take. This workflow is
# started by GitHub whenever builds.yml starts or ends, and GitHub always
# runs it from main, whatever branch the build was of. So the update key,
# the token that writes the release and the tools that use them are
# main's, and nothing a branch holds runs beside them.
#
# The key is read in the environment called updates. Kept there, and that
# environment limited to main in the repository's settings, no branch can
# read it, not even one that rewrites this file: a branch's copy of this
# file is never what runs, and a branch's copy of builds.yml cannot enter
# an environment limited to main.
#
# From the build it takes the zip and nothing else. Which channel it is,
# which commit and which version, it works out again from GitHub's own
# record of the run, by the same rules builds.yml goes by. A build is still
# a branch's code, so what the zip holds is as trusted as the branch: the
# key is the development key, which only development builds carry.
#
# Every step is one command of cmd/speakertrail-release, which makes
# every decision in Go, with tests, the way FrameFairy's publish does it,
# #57. Four jobs:
#
# 1. announce, the moment a build starts, writes the channel list again,
#    so the Updates page says for the whole of the build that the build it
#    offers is not the newest.
# 2. built, on Linux, asks whether the build left a zip, so a run that
#    built nothing starts no Mac.
# 3. publish, per channel, one after another and never stopped half way,
#    checks the zip, packs it in parts, signs the zip and the stored zip,
#    and uploads to the release dev the pieces the release lacks, the
#    zip, the stored zip packed with zstd, its parts and its entry. When
#    it is a pull request's build, it marks the commit ready to update
#    to. The patches go up last. A build it does not publish says why on
#    its commit.
# 4. list, when a build ends, writes the list again from every entry.
#    It also takes away the entry of any pull request that is not open any
#    more, which is how a closed pull request leaves the list, and what no
#    build reaches. A list job still waiting is replaced by the next one,
#    which writes the same list and more, so nothing depends on any one of
#    them running.
#
# announce and list share one queue, and each writes the list from what is
# there when it runs, so the order they run in does not matter. So both,
# once the list is written, cancel a publish that has waited half an hour
# to enter the environment, see unstick in channels.go.
name: Publish builds

on:
  workflow_run:
    workflows: ["Builds to update to"]
    types: [requested, completed]

permissions: {}

jobs:
  announce:
    if: >-
      github.event.action == 'requested' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: builds-list
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
      # What became of a commit's build, and the publish runs that wait.
      actions: write
      statuses: read
      # To check main's signature on the release tool.
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # main's signed build of the release tool, or built here with no
      # cache, as in publish: main's Go cache is written by jobs that run
      # third-party build code, and this job holds a token that writes
      # the release, #55.
      - uses: ./.github/actions/release-tool
      # Until the key is made the tool says so and writes nothing, since a
      # list without it cannot be checked.
      - name: Write the channel list from every entry
        run: speakertrail-release channels
      # Also when the list could not be written, as when it was a job of
      # its own.
      - name: Cancel a publish stuck before the environment
        if: ${{ !cancelled() }}
        run: speakertrail-release unstick

  # Whether the build left a zip, asked on Linux, so a run that built
  # nothing starts no Mac: the close of a pull request, a push to a branch
  # with no pull request, a commit built already. Macs are scarce, and a
  # publish waits for one before it finds out there is nothing to do.
  # Only a run of builds.yml itself, started by a push or by a pull
  # request. A workflow is matched above by its name, and any file can
  # take that name. A run of a pull request is the branch's code as a
  # push's is, and its commit goes through the same check of history in
  # publish, so it is published the same way.
  built:
    if: >-
      github.event.action == 'completed' &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'pull_request') &&
      github.event.workflow_run.path == '.github/workflows/builds.yml' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      zip: ${{ steps.zip.outputs.zip }}
    steps:
      - id: zip
        name: Did the build leave a zip
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
        run: >-
          gh api "repos/$GH_REPO/actions/runs/$RUN/artifacts"
          --jq '"zip=\([.artifacts[] | select(.name == "build" and (.expired | not))] | length > 0)"'
          >> "$GITHUB_OUTPUT"

  publish:
    needs: built
    if: >-
      needs.built.outputs.zip == 'true' &&
      github.event.action == 'completed' &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'pull_request') &&
      github.event.workflow_run.path == '.github/workflows/builds.yml' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    # On a Mac, for codesign and the keychain, see "Sign it with the
    # Developer ID" below.
    runs-on: macos-15
    timeout-minutes: 20
    environment: updates
    concurrency:
      group: builds-publish-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
      actions: read
      statuses: write
      # To check main's signature on the release tool.
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # main, the default for a workflow_run, never the branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The release tool is put on the path once, here, in a step without
      # any secret, and every step after runs that program. So the
      # secrets reach only the tool itself, never go, its compiler or
      # what it downloads. It is main's build of this code, signed by
      # main's release-tool.yml, or, right after a change to the tool,
      # built here with no cache. The Go cache of main is written by
      # builds.yml and ci.yml too, while they run npm's install scripts,
      # cgo and cmake on third-party code, and Go trusts what it compiled
      # before. Restored here, it would build the tool that holds the
      # Developer ID. See .github/actions/release-tool.
      - uses: ./.github/actions/release-tool

      # What the build is a build of, from GitHub's record of the run and
      # not from anything the build wrote, and only a commit its
      # channel's history holds: main's for main, the pull request's for a
      # pull request. See publishPlan in publish.go.
      - id: which
        name: What this is a build of
        env:
          EVENT: ${{ github.event.workflow_run.event }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN: ${{ github.event.workflow_run.id }}
        run: >-
          speakertrail-release publish-plan
          -run "$RUN" -event "$EVENT" -branch "$BRANCH" -commit "$SHA"

      - if: steps.which.outputs.run == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: ${{ runner.temp }}/build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - id: zip
        if: steps.which.outputs.run == 'true'
        name: Is there a zip to sign
        env:
          BUILT: ${{ runner.temp }}/build/app.zip
          ZIP: ${{ steps.which.outputs.zip }}
        run: |
          mkdir -p dist
          if [ -f "$BUILT" ]; then
            mv "$BUILT" "dist/$ZIP"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The build left no app.zip, so there is nothing to sign."
          fi

      # What the zip holds is read here, in a step that has no key, and a
      # build that is refused never reaches the step that has one. sign
      # reads it again before it signs, so the tool never signs what it
      # has not read, whoever runs it. What a step that refuses says is
      # kept in refused.txt, which not-published reads.
      - id: check
        if: steps.zip.outputs.ready == 'true'
        name: Check what it could do
        env:
          ZIP: ${{ steps.which.outputs.zip }}
        run: |
          if ! speakertrail-release check -zip "dist/$ZIP" 2> "$RUNNER_TEMP/said.txt"; then
            mv "$RUNNER_TEMP/said.txt" "$RUNNER_TEMP/refused.txt"
            cat "$RUNNER_TEMP/refused.txt" >&2
            exit 1
          fi

      # The libraries of the builds the release holds, main's first, as
      # they were signed then. harden keeps such a copy in place of a
      # library it signed afresh when the two are the same signed code, so
      # a library whose code did not change is the same file in every
      # build, #128. In a step without any secret, since what the release
      # holds is untrusted, and harden checks a kept copy like any other.
      # What cannot be had costs only the keeping. See kept.go.
      - id: before
        if: steps.check.outcome == 'success'
        name: Earlier copies of the libraries
        continue-on-error: true
        env:
          CHANNEL: ${{ steps.which.outputs.channel }}
        run: |
          gh release view dev --json assets > "$RUNNER_TEMP/assets.json" || true
          gh release download dev --pattern channels.json --dir "$RUNNER_TEMP" --clobber || true
          speakertrail-release signed-before -list "$RUNNER_TEMP/channels.json" \
            -assets "$RUNNER_TEMP/assets.json" -channel "$CHANNEL" -out "$RUNNER_TEMP/kept"

      # Every build Tim gets is signed again with his Developer ID and the
      # hardened runtime, so no other program can put its code into the
      # app, and macOS knows the app again after an update and does not ask
      # for the microphone or the keychain anew. Until build/team-id.txt
      # names Tim's team, harden says so and the build stays signed ad hoc,
      # the way it is made. Once it does, a build without the Developer ID
      # is never published. See cmd/speakertrail-release/devid.go and
      # docs/UPDATES.md, The Developer ID.
      - id: harden
        if: steps.check.outcome == 'success'
        name: Sign it with the Developer ID
        env:
          SPEAKERTRAIL_DEVELOPER_ID: ${{ secrets.SPEAKERTRAIL_DEVELOPER_ID }}
          SPEAKERTRAIL_DEVELOPER_ID_PASSWORD: ${{ secrets.SPEAKERTRAIL_DEVELOPER_ID_PASSWORD }}
          ZIP: ${{ steps.which.outputs.zip }}
        run: |
          if ! speakertrail-release harden -zip "dist/$ZIP" -kept "$RUNNER_TEMP/kept" 2> "$RUNNER_TEMP/said.txt"; then
            mv "$RUNNER_TEMP/said.txt" "$RUNNER_TEMP/refused.txt"
            cat "$RUNNER_TEMP/refused.txt" >&2
            exit 1
          fi

      # The zip the build left deflates every file. Packed again, each file
      # is stored as it is, and its parts and pieces let an app that knows
      # them download only the files it does not have, and the stored zip
      # packed with zstd is what it downloads when they fail. Each file
      # that changed also gets a patch against the same file of the builds
      # an app may run, the listed ones and the newest that left the list,
      # which the release tool picks from the channel list and the
      # release's files. What of them cannot be read costs patches, never
      # the publish, and is a warning on the run. It runs after check, so
      # it only reads a zip whose size check has held, after the signing
      # with the Developer ID, so its parts are of the build Tim gets, and
      # before the key, which it has no need of. See docs/UPDATES.md.
      - id: pack
        if: steps.check.outcome == 'success'
        name: Pack it in parts
        env:
          ZIP: ${{ steps.which.outputs.zip }}
          CHANNEL: ${{ steps.which.outputs.channel }}
        # The release's files and the channel list are the ones the step
        # before read, so the builds patched against are the same.
        run: |
          if ! speakertrail-release pack -zip "dist/$ZIP" -out "$RUNNER_TEMP/packed" \
            -channel "$CHANNEL" -list "$RUNNER_TEMP/channels.json" -assets "$RUNNER_TEMP/assets.json" \
            2> "$RUNNER_TEMP/said.txt"; then
            mv "$RUNNER_TEMP/said.txt" "$RUNNER_TEMP/refused.txt"
            cat "$RUNNER_TEMP/refused.txt" >&2
            exit 1
          fi

      - id: key
        if: steps.pack.outcome == 'success'
        name: Is there an update key
        env:
          KEY: ${{ secrets.SPEAKERTRAIL_UPDATE_KEY }}
        run: |
          if [ -z "$KEY" ] || [ ! -s cmd/speakertrail-app/update-key.txt ]; then
            echo "::notice::No update key yet, so nothing is published. See docs/UPDATES.md, The keys."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # The channel's entry there is now, read in a step without the key,
      # so sign does not put a build in the place of one made after it, a
      # run of an older commit made again. See orderEntry in
      # cmd/speakertrail-release.
      - if: steps.key.outputs.ready == 'true'
        name: The entry there is now
        env:
          CHANNEL: ${{ steps.which.outputs.channel }}
        run: |
          mkdir -p "$RUNNER_TEMP/current"
          gh release download dev --pattern "channel-$CHANNEL.json" --dir "$RUNNER_TEMP/current" --clobber || true

      - id: sign
        if: steps.key.outputs.ready == 'true'
        name: Sign it
        env:
          SPEAKERTRAIL_UPDATE_KEY: ${{ secrets.SPEAKERTRAIL_UPDATE_KEY }}
          ZIP: ${{ steps.which.outputs.zip }}
          CHANNEL: ${{ steps.which.outputs.channel }}
          NAME: ${{ steps.which.outputs.name }}
          VERSION: ${{ steps.which.outputs.version }}
          COMMIT: ${{ steps.which.outputs.commit }}
          TEAM: ${{ steps.harden.outputs.team }}
          # When the run that built it was created, which a run made again
          # keeps, signed into the entry so the app never takes an older
          # build of a channel in a newer one's place.
          MADE: ${{ github.event.workflow_run.created_at }}
        # With the Developer ID, sign refuses a build that is not signed
        # with it and the hardened runtime throughout, so it is never lost
        # on the way without anyone seeing.
        run: |
          if ! speakertrail-release sign -team "$TEAM" \
            -made "$MADE" -current "$RUNNER_TEMP/current/channel-$CHANNEL.json" \
            -zip "dist/$ZIP" -parts "$RUNNER_TEMP/packed/parts.json" \
            -channel "$CHANNEL" -name "$NAME" \
            -version "$VERSION" -commit "$COMMIT" \
            -url "https://github.com/$GH_REPO/releases/download/dev/$ZIP" \
            -out "dist/channel-$CHANNEL.json" 2> "$RUNNER_TEMP/said.txt"; then
            mv "$RUNNER_TEMP/said.txt" "$RUNNER_TEMP/refused.txt"
            cat "$RUNNER_TEMP/refused.txt" >&2
            exit 1
          fi

      # The pieces the release lacks, the zip, the stored zip packed and
      # the parts, then the entry, then Ready to update to on a pull
      # request's commit, and the patches last, so a build is on Updates
      # without waiting for them. See publish in publish.go.
      - id: upload
        if: steps.sign.outcome == 'success' && steps.sign.outputs.newer != 'true'
        name: Upload the build
        env:
          ZIP: ${{ steps.which.outputs.zip }}
          CHANNEL: ${{ steps.which.outputs.channel }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          speakertrail-release publish -zip "dist/$ZIP" -as "$ZIP"
          -packed "$RUNNER_TEMP/packed" -entry "dist/channel-$CHANNEL.json"
          -channel "$CHANNEL" -commit "$SHA"

      # This workflow runs from main, so a build it does not publish fails
      # here, on main's runs, and the pull request would only miss its
      # Ready to update to with no reason given. Whatever failed, the
      # reason goes on the commit that was built, where the pull request
      # shows it, and the channel list stops saying a build is coming.
      - name: Say on the commit why it is not published
        if: failure() && steps.which.outputs.run == 'true'
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          speakertrail-release not-published -commit "$SHA"
          -run "$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
          -refusal "$RUNNER_TEMP/refused.txt"

  # Also when publish was skipped, for a run that left no zip: the close
  # of a pull request is how it leaves the list. And when it failed or was
  # cancelled: the list is written from the entries there are, and only
  # this job makes room on the release. It once ran only after a publish
  # that worked, so a full release stayed full.
  list:
    needs: publish
    if: >-
      always() && github.event.action == 'completed' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: builds-list
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
      # What became of a commit's build, and the publish runs that wait.
      actions: write
      statuses: read
      # To check main's signature on the release tool.
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # main's signed build of the release tool, or built here with no
      # cache, as in publish: main's Go cache is written by jobs that run
      # third-party build code, and this job holds a token that writes
      # the release, #55.
      - uses: ./.github/actions/release-tool
      # The list, and then what no build reaches any more: a zip no entry
      # points at, with its packed zip, the parts of every build no new
      # build is patched against, every piece no remaining parts name, and
      # every patch no listed build's parts name. Not at once: a publish
      # that runs beside this job may have uploaded files whose entry this
      # job has not seen yet. See channels.go and unreachable in
      # release.go.
      - name: Write the channel list from every entry
        run: speakertrail-release channels
      # Also when the list could not be written, as when it was a job of
      # its own.
      - name: Cancel a publish stuck before the environment
        if: ${{ !cancelled() }}
        run: speakertrail-release unstick
