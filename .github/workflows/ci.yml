name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check
        working-directory: .
        run: make interface
      - name: Build
        run: npm run build
      - name: Chromium for the walks
        run: npx playwright install --with-deps chromium
      - name: Walks
        working-directory: .
        run: make walks

  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # The app's window is a webview, which on Linux is GTK and WebKit.
      - name: GTK and WebKit
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: make unit

  # The app on the machine it is for. Tim's Mac is Apple silicon, and so is
  # this runner.
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # What make run builds on Tim's Mac, Speaker Trail.app, signed ad hoc
      # and read back by codesign.
      - name: Build the app
        run: make app
      - name: Tests
        run: go test -count=1 ./...

