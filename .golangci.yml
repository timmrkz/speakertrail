# What golangci-lint holds every pull request to, run by make lint. Ported
# from FrameFairy's, with only the rule this repository has use for so far.
#
# No code of ours writes to the standard library's log, outside the tests:
# the app logs through theLog and the engine and the API through the slog
# logger the app gives them, the ones that reach the app's log, see
# docs/LOGGING.md. What a library writes there still reaches it, see
# takeStandardLog in cmd/speakertrail-app/applog.go.
#
# No test waits on the clock or reads it: no sleep, no timer, no
# time.After and no time.Now, Since or Until, see the testing skill. A
# test says when things happened with a date of its own. A test in a
# synctest bubble, whose clock is fake, says so where it uses one, with
# //nolint:forbidigo // synctest bubble. The few tests whose code reads
# the real clock and has no clock handed in say why on the line, the
# same way. nolintlint fails a //nolint that stops nothing, so a line
# fixed loses its exception in the same change. A new exception is not
# refused, it shows in the diff, and the review asks why.
version: "2"
linters:
  default: none
  enable: [forbidigo, nolintlint]
  settings:
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^log\.(Print|Printf|Println|Fatal|Fatalf|Fatalln|Panic|Panicf|Panicln)$
          pkg: ^log$
          msg: "our code logs through theLog in the app and through the slog logger the app gives the engine and the API, which reach the app's log, see docs/LOGGING.md"
        - pattern: ^time\.(Sleep|After|AfterFunc|Tick|NewTimer|NewTicker|Now|Since|Until)$
          pkg: ^time$
          msg: "a test never waits on the clock or reads it: hand in a fake clock, say when with a date of the test's own, run it in a synctest bubble, or wait for the event of the step, see the testing skill"
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
  exclusions:
    rules:
      - path: _test\.go$
        linters: [forbidigo]
        text: our code logs through
      - path-except: _test\.go$
        linters: [forbidigo]
        text: a test never waits on the clock
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
