# A pull request starts only the jobs whose code it changed: the Go job
# when Go changed, the interface's job when the interface changed, and
# the job that builds the whole app on a Mac, macos, when either did. What
# counts as which is the filters of the job changes, below. A change to
# the docs alone starts nothing. A push to main starts every job. Ported
# from FrameFairy, which works the same way.
#
# No branch rule requires a check, so nothing waits on a job that was
# never started.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # What the pull request changed, by the files GitHub lists for it. Go is
  # every file outside web/, the docs and .claude/, so a script, the
  # Makefile or a workflow is Go, and the files of web/ Go reads, goread:
  # the package that embeds the built interface, and dist/.keep, which
  # keeps the folder it embeds there before the interface is built. The
  # interface is web/, the Makefile and the workflows. See CI in
  # docs/BUILD.md.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ github.event_name == 'push' || steps.filter.outputs.go == 'true' || steps.filter.outputs.goread == 'true' }}
      interface: ${{ github.event_name == 'push' || steps.filter.outputs.interface == 'true' }}
      app: ${{ github.event_name == 'push' || steps.filter.outputs.go == 'true' || steps.filter.outputs.goread == 'true' || steps.filter.outputs.interface == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            go:
              - '**'
              - '!web/**'
              - '!docs/**'
              - '!**/*.md'
              - '!.claude/**'
            goread:
              - 'web/{*.go,dist/.keep}'
            interface:
              - '{web/**,.github/workflows/**,Makefile}'

  web:
    needs: changes
    if: needs.changes.outputs.interface == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check
        working-directory: .
        run: make interface
      - name: Build
        run: npm run build
      # The walks launch Chromium headless, which is Playwright's headless
      # shell alone, not the whole browser beside it, 186.8 MiB less to
      # download on every run. The system packages it needs are kept the
      # way the go job keeps GTK's, see there.
      - id: image
        run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - id: debs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/debs
          key: debs-chromium-${{ steps.image.outputs.version }}-${{ hashFiles('web/package-lock.json') }}
      - name: Chromium for the walks, its packages from apt
        if: steps.debs.outputs.cache-hit != 'true'
        run: sudo apt-get clean && npx playwright install --with-deps --only-shell chromium && mkdir -p ~/debs && cp /var/cache/apt/archives/*.deb ~/debs/
      - name: Chromium for the walks, its packages kept
        if: steps.debs.outputs.cache-hit == 'true'
        run: sudo dpkg -i ~/debs/*.deb && npx playwright install --only-shell chromium
      - name: Walks
        working-directory: .
        run: make walks
      - if: (github.ref == 'refs/heads/main' || github.head_ref == 'claude/project-thread-kkxip8') && steps.debs.outputs.cache-hit != 'true' # TEMPORARY, to prove a hit before the merge
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/debs
          key: debs-chromium-${{ steps.image.outputs.version }}-${{ hashFiles('web/package-lock.json') }}

  # Go's modules are kept by go.sum. What Go built and tested, and what
  # golangci-lint found, are kept from the last run on main, so a pull
  # request builds and tests again only the packages it changed, and those
  # with a test that reads a file of the repository, since Go knows a file
  # by when it changed and a checkout makes every file new. Only main saves
  # them, and only
  # after every step passed. Not setup-go's own cache, which is kept by
  # go.sum alone and so holds a build ever further behind main, and which
  # publish.yml's jobs that write restore, see #55. See CI in
  # docs/BUILD.md.
  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-modules-${{ runner.os }}-${{ hashFiles('go.sum') }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-built-${{ runner.os }}-${{ github.sha }}
          restore-keys: go-built-${{ runner.os }}-
      # The app's window is a webview, which on Linux is GTK and WebKit.
      # Ubuntu's mirror took 30 s to over 3 minutes to hand them over, see
      # #97, so what apt fetched is kept in GitHub's cache and installed
      # from there with dpkg, with no mirror asked. What apt fetches
      # depends on what the runner's image has installed already, so the
      # cache is kept by the image's version, which the runner names in
      # ImageOS and ImageVersion. Only main saves it, as for Go.
      - id: image
        run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - id: debs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/debs
          key: debs-gtk-4-webkitgtk-6.0-${{ steps.image.outputs.version }}
      - name: GTK and WebKit from apt
        if: steps.debs.outputs.cache-hit != 'true'
        run: sudo apt-get clean && sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends --download-only libgtk-4-dev libwebkitgtk-6.0-dev && mkdir -p ~/debs && cp /var/cache/apt/archives/*.deb ~/debs/
      - name: GTK and WebKit
        run: sudo dpkg -i ~/debs/*.deb
      - name: Lint
        run: make lint
      - name: Test
        run: make unit
      - if: github.ref == 'refs/heads/main' && steps.modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-modules-${{ runner.os }}-${{ hashFiles('go.sum') }}
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-built-${{ runner.os }}-${{ github.sha }}
      - if: (github.ref == 'refs/heads/main' || github.head_ref == 'claude/project-thread-kkxip8') && steps.debs.outputs.cache-hit != 'true' # TEMPORARY, to prove a hit before the merge
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/debs
          key: debs-gtk-4-webkitgtk-6.0-${{ steps.image.outputs.version }}

  # The app on the machine it is for. Tim's Mac is Apple silicon, and so is
  # this runner. Its limit leaves room for building llama-server, minutes,
  # when scripts/build-llama.sh changed and the cache below has none. Go
  # is kept the way the go job keeps it.
  macos:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - id: modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-modules-${{ runner.os }}-${{ hashFiles('go.sum') }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/go-build
          key: go-built-${{ runner.os }}-${{ github.sha }}
          restore-keys: go-built-${{ runner.os }}-
      # The llama-server the app carries takes minutes to build, so it is
      # kept until scripts/build-llama.sh changes, the rule make llama
      # follows too. See docs/BUILD.md.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/llama
          key: llama-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-llama.sh') }}
      # What make run builds on Tim's Mac, Speaker Trail.app, signed ad hoc
      # and read back by codesign.
      - name: Build the app
        run: make app
      # What publish.yml does to every build before Tim gets it: signed
      # again with the hardened runtime and the microphone, by the same
      # code, speakertrail-release harden. Here with a certificate made for the
      # test, since the Developer ID is a secret only main's publish.yml
      # reads. It proves the signing, and that the release tool reads
      # what codesign wrote, not that the app opens: under the hardened
      # runtime a certificate that is not Apple's has no team, and macOS
      # would load no library of its own.
      - name: Sign it the way publish.yml does
        run: |
          dir="$RUNNER_TEMP/signing"
          mkdir -p "$dir"
          cp -R "bin/Speaker Trail.app" "$dir/"
          printf '%s\n' '[req]' 'distinguished_name=dn' 'x509_extensions=ext' 'prompt=no' \
            '[dn]' 'CN=Speaker Trail Test Signing' \
            '[ext]' 'keyUsage=critical,digitalSignature' 'extendedKeyUsage=critical,codeSigning' \
            > "$dir/test.cnf"
          /usr/bin/openssl req -x509 -newkey rsa:2048 -nodes -days 1 -config "$dir/test.cnf" \
            -keyout "$dir/test.key" -out "$dir/test.crt"
          export SPEAKERTRAIL_DEVELOPER_ID_PASSWORD=$(/usr/bin/openssl rand -hex 16)
          /usr/bin/openssl pkcs12 -export -inkey "$dir/test.key" -in "$dir/test.crt" \
            -out "$dir/test.p12" -passout "pass:$SPEAKERTRAIL_DEVELOPER_ID_PASSWORD"
          go run ./cmd/speakertrail-release harden -app "$dir/Speaker Trail.app" -p12 "$dir/test.p12" \
            -identity "Speaker Trail Test Signing" -timestamp=false \
            -requirement 'certificate leaf[subject.CN] = "Speaker Trail Test Signing"'
      - name: The release tool reads what codesign wrote
        run: >-
          SIGNED_APP="$RUNNER_TEMP/signing/Speaker Trail.app"
          ADHOC_APP="$PWD/bin/Speaker Trail.app"
          APPLE_CAS=1
          go test -count=1 -run 'TestARealSignatureIsReadAsCodesignWroteIt|TestApplesRealAuthorityIsTaken' -v ./cmd/speakertrail-release/
      - name: Tests
        run: go test -timeout 2m ./...
      # The keychain is the Mac's own, which the test cache cannot see, so
      # its tests run every time.
      - name: The keychain, uncached
        run: go test -count=1 -timeout 2m ./internal/keys/
      - if: github.ref == 'refs/heads/main' && steps.modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-modules-${{ runner.os }}-${{ hashFiles('go.sum') }}
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/go-build
          key: go-built-${{ runner.os }}-${{ github.sha }}

