name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check
        working-directory: .
        run: make interface
      - name: Build
        run: npm run build
      - name: Chromium for the walks
        run: npx playwright install --with-deps chromium
      - name: Walks
        working-directory: .
        run: make walks

  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # The app's window is a webview, which on Linux is GTK and WebKit.
      - name: GTK and WebKit
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Lint
        run: make lint
      - name: Test
        run: make unit

  # The app on the machine it is for. Tim's Mac is Apple silicon, and so is
  # this runner.
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # What make run builds on Tim's Mac, Speaker Trail.app, signed ad hoc
      # and read back by codesign.
      - name: Build the app
        run: make app
      # What publish.yml does to every build before Tim gets it: signed
      # again with the hardened runtime and the microphone, by the same
      # script, scripts/sign-macos.sh. Here with a certificate made for the
      # test, since the Developer ID is a secret only main's publish.yml
      # reads. It proves the signing, and that the release tool reads
      # what codesign wrote, not that the app opens: under the hardened
      # runtime a certificate that is not Apple's has no team, and macOS
      # would load no library of its own.
      - name: Sign it the way publish.yml does
        env:
          TIMESTAMP: none
        run: |
          dir="$RUNNER_TEMP/signing"
          mkdir -p "$dir"
          cp -R "bin/Speaker Trail.app" "$dir/"
          printf '%s\n' '[req]' 'distinguished_name=dn' 'x509_extensions=ext' 'prompt=no' \
            '[dn]' 'CN=Speaker Trail Test Signing' \
            '[ext]' 'keyUsage=critical,digitalSignature' 'extendedKeyUsage=critical,codeSigning' \
            > "$dir/test.cnf"
          /usr/bin/openssl req -x509 -newkey rsa:2048 -nodes -days 1 -config "$dir/test.cnf" \
            -keyout "$dir/test.key" -out "$dir/test.crt"
          export SIGN_PASSWORD=$(/usr/bin/openssl rand -hex 16)
          /usr/bin/openssl pkcs12 -export -inkey "$dir/test.key" -in "$dir/test.crt" \
            -out "$dir/test.p12" -passout "pass:$SIGN_PASSWORD"
          sh scripts/sign-macos.sh "$dir/Speaker Trail.app" "$dir/test.p12" "Speaker Trail Test Signing"
      - name: The release tool reads what codesign wrote
        run: >-
          SIGNED_APP="$RUNNER_TEMP/signing/Speaker Trail.app"
          ADHOC_APP="$PWD/bin/Speaker Trail.app"
          go test -count=1 -run TestARealSignatureIsReadAsCodesignWroteIt -v ./cmd/speakertrail-release/
      - name: Tests
        run: go test -count=1 ./...

